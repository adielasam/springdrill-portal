<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRINGDRILL - UTME Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-color: #f4f7fa; --card-bg: #ffffff; --text-color: #333333; --text-muted: #6c757d; --border-color: #e9ecef; --input-bg: #f8f9fa; --utme-green: #007a4d;}
        body.dark-mode { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --text-muted: #a0a0a0; --border-color: #333333; --input-bg: #2c2c2c; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; transition: 0.3s; }
        
        .sidebar { width: 260px; position: fixed; top: 0; left: 0; height: 100vh; background: #004d34; color: white; padding-top: 30px; z-index: 1050; box-shadow: 4px 0 15px rgba(0,0,0,0.1); transition: left 0.3s ease;}
        .sidebar-brand { text-align: center; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .nav-link { color: rgba(255,255,255,0.8); padding: 12px 20px; margin: 2px 10px; border-radius: 5px; text-decoration: none; display: flex; align-items: center; font-size: 0.95rem;}
        .nav-link i { width: 25px; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.15); color: white; font-weight: bold; border-left: 4px solid #f1c40f;}

        .main-content { margin-left: 260px; padding: 20px 40px; min-height: 100vh; transition: margin-left 0.3s ease;}
        .top-navbar { background: var(--card-bg); padding: 15px 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }

        /* Analytics Cards */
        .stat-card { background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); display: flex; align-items: center; gap: 20px; height: 100%;}
        .stat-icon { width: 65px; height: 65px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white;}
        .stat-info h6 { font-weight: bold; color: var(--text-muted); margin-bottom: 5px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;}
        .stat-info h2 { font-weight: 900; color: var(--text-color); margin-bottom: 0; line-height: 1;}

        /* Table Styles */
        .history-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.03); padding: 25px; margin-top: 30px;}
        .table-responsive { border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
        .custom-table { width: 100%; margin: 0; color: var(--text-color); font-size: 0.95rem; }
        .custom-table th { background: var(--input-bg); padding: 15px; text-transform: uppercase; color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1px; font-weight: 800; border-bottom: 2px solid var(--border-color);}
        .custom-table td { padding: 15px; border-bottom: 1px solid var(--border-color); vertical-align: middle; font-weight: 600;}
        .custom-table tr:last-child td { border-bottom: none; }
        
        .score-badge { font-weight: bold; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; }
        .score-excellent { background: rgba(39, 174, 96, 0.1); color: #27ae60; border: 1px solid rgba(39, 174, 96, 0.3);}
        .score-average { background: rgba(241, 196, 15, 0.1); color: #d35400; border: 1px solid rgba(241, 196, 15, 0.3);}
        .score-poor { background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3);}

        .mobile-menu-toggle { display: none; background: none; border: none; color: var(--utme-green); font-size: 1.8rem; cursor: pointer;}
        .sidebar-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1040; display: none; }

        @media (max-width: 992px) {
            .sidebar { left: -260px; }
            .sidebar.mobile-open { left: 0; }
            .main-content { margin-left: 0; padding: 15px; }
            .mobile-menu-toggle { display: inline-block; }
            .stat-card { margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand d-flex justify-content-between align-items-center px-3">
            <h5 class="text-white fw-bold m-0"><i class="fas fa-graduation-cap text-warning me-2"></i> SPRINGDRILL</h5>
            <button class="btn btn-sm text-white d-lg-none" onclick="toggleSidebar()"><i class="fas fa-times fs-4"></i></button>
        </div>
        <nav class="nav flex-column mt-3">
            <a href="student_dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
            <a href="student_utme.html" class="nav-link"><i class="fas fa-robot"></i> AI JAMB Simulator</a>
            <a href="student_utme_hub.html" class="nav-link active fw-bold text-warning"><i class="fas fa-university"></i> Real UTME Hub</a>
            <a href="student_results.html" class="nav-link"><i class="fas fa-chart-line"></i> My Results</a>
            <a href="student_messages.html" class="nav-link"><i class="fas fa-envelope"></i> Messages</a>
            <hr class="mx-3 my-4 border-secondary">
            <a href="#" id="logoutBtn" class="nav-link text-danger mt-auto"><i class="fas fa-power-off"></i> Secure Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-navbar border-start border-4" style="border-color: #6b21a8 !important;">
            <div class="d-flex align-items-center">
                <button class="mobile-menu-toggle me-3" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <div class="fw-bold text-muted d-flex align-items-center">
                    <a href="student_utme_hub.html" class="text-decoration-none text-muted me-2"><i class="fas fa-arrow-left"></i> Hub</a>
                    / <i class="fas fa-chart-line ms-2 me-2" style="color: #6b21a8;"></i> Performance Analysis
                </div>
            </div>
            <button class="dark-toggle-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon bg-primary shadow-sm"><i class="fas fa-list-ol"></i></div>
                    <div class="stat-info">
                        <h6>Exams Taken</h6>
                        <h2 id="totalExams">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card border-success">
                    <div class="stat-icon bg-success shadow-sm"><i class="fas fa-trophy"></i></div>
                    <div class="stat-info">
                        <h6 class="text-success">Highest JAMB Score</h6>
                        <h2 id="highestScore">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card border-warning">
                    <div class="stat-icon bg-warning shadow-sm"><i class="fas fa-chart-pie"></i></div>
                    <div class="stat-info">
                        <h6 class="text-warning">Average Score</h6>
                        <h2 id="avgScore">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="history-card">
            <h5 class="fw-bold mb-4"><i class="fas fa-history me-2 text-muted"></i> Exam History Log</h5>
            
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Exam Type</th>
                            <th>Total Questions</th>
                            <th>Final Score (/400)</th>
                            <th>Remarks</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr><td colspan="5" class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin me-2"></i> Loading your records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('mobile-open');
            const overlay = document.getElementById('sidebarOverlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        };

        window.toggleTheme = () => {
            const body = document.body; body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('SPRINGDRILL_THEME', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-sun text-warning' : 'fas fa-moon';
        };
        if (localStorage.getItem('SPRINGDRILL_THEME') === 'dark') window.toggleTheme();

        async function fetchAnalytics() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = 'login.html';

            try {
                // Fetch ONLY the exams taken on the "Real UTME Hub" (test_id: 998)
                const { data: results, error } = await supabase
                    .from('test_results')
                    .select('*')
                    .eq('student_id', session.user.id)
                    .eq('test_id', 998)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!results || results.length === 0) {
                    document.getElementById('historyTableBody').innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted fw-bold"><i class="fas fa-folder-open fs-2 mb-3 d-block text-black-50"></i>No exams taken yet. Return to the hub to start practicing!</td></tr>`;
                    return;
                }

                // Calculate Stats
                document.getElementById('totalExams').innerText = results.length;
                
                let maxScore = 0;
                let sumScore = 0;

                const tableRows = results.map(row => {
                    const score = parseInt(row.score) || 0;
                    if (score > maxScore) maxScore = score;
                    sumScore += score;

                    // Format Date
                    const dateObj = new Date(row.created_at);
                    const formattedDate = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                    const formattedTime = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                    // Generate Badge
                    let badgeHtml = '';
                    if (score >= 250) badgeHtml = `<span class="score-badge score-excellent"><i class="fas fa-check-circle me-1"></i> Excellent</span>`;
                    else if (score >= 200) badgeHtml = `<span class="score-badge score-average"><i class="fas fa-minus-circle me-1"></i> Average</span>`;
                    else badgeHtml = `<span class="score-badge score-poor"><i class="fas fa-times-circle me-1"></i> Needs Work</span>`;

                    return `
                        <tr>
                            <td><i class="fas fa-calendar-alt text-muted me-2"></i> ${formattedDate} <br><small class="text-muted ms-4">${formattedTime}</small></td>
                            <td><span class="badge" style="background-color: #6b21a8;">Real UTME Hub</span></td>
                            <td>${row.total_score || 'N/A'}</td>
                            <td class="fw-bold" style="font-size: 1.1rem;">${score}</td>
                            <td>${badgeHtml}</td>
                        </tr>
                    `;
                }).join('');

                // Update Stats UI
                document.getElementById('highestScore').innerText = maxScore;
                document.getElementById('avgScore').innerText = Math.round(sumScore / results.length);
                document.getElementById('historyTableBody').innerHTML = tableRows;

            } catch(e) {
                console.error("Error fetching analytics:", e);
                document.getElementById('historyTableBody').innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Error loading data. Please try again.</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAnalytics);
        document.getElementById('logoutBtn').addEventListener('click', async (e) => { e.preventDefault(); await supabase.auth.signOut(); window.location.href = 'login.html'; });
    </script>
</body>
</html>
