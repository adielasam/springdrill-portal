<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School portal — SpringDrill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand-600: #059669; --brand-dark: #004d34; }
        body { background: #f9fafb; font-family: 'Inter', sans-serif; color: #111827; }
        .sd-card { max-width: 560px; margin: 48px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px; box-shadow: 0 4px 12px rgba(0,0,0,.05); text-align: center; }
        .sd-brand { font-weight: 800; font-size: 20px; letter-spacing: -.5px; color: var(--brand-600); margin: 0; }
        .btn-brand { background: var(--brand-600); border-color: var(--brand-600); color: #fff; font-weight: 600; }
        .btn-brand:hover { background: #047857; border-color: #047857; color: #fff; }
        .school-logo { width: 96px; height: 96px; object-fit: contain; border-radius: 12px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container px-3">
        <div class="sd-card">
            <p class="sd-brand">SpringDrill</p>

            <div id="loadingState" class="py-4">
                <div class="spinner-border text-success" role="status" aria-label="Loading"></div>
                <p class="text-muted mt-3" style="font-size: 14px;">Loading your school's portal...</p>
            </div>

            <div id="schoolState" style="display:none;">
                <img id="schoolLogo" class="school-logo" style="display:none;" alt="School logo">
                <h1 id="schoolName" class="h4 fw-bold mt-2 mb-1"></h1>
                <p id="schoolMotto" class="text-muted fst-italic" style="font-size: 14px;"></p>
                <p id="schoolAddress" class="text-muted" style="font-size: 14px;"></p>
                <div id="schoolNotice" class="alert" style="display:none; font-size: 14px;"></div>
                <div id="loginBlock">
                    <a href="/#signin" class="btn btn-brand w-100 py-2">Log in to your school portal</a>
                    <p class="text-muted mt-3 mb-0" style="font-size: 13px;">Admins, teachers and students of this school sign in here.</p>
                </div>
            </div>

            <div id="notFoundState" style="display:none;">
                <h1 class="h4 fw-bold mt-2 mb-1">School not found</h1>
                <p class="text-muted" style="font-size: 14px;">There is no school at this address. Check the link, or register your school with SpringDrill.</p>
                <a href="/school_signup.html" class="btn btn-brand w-100 py-2">Register your school</a>
            </div>

            <p class="text-center mt-4 mb-0" style="font-size: 13px;"><a href="/" class="text-muted">Back to SpringDrill home</a></p>
        </div>
    </div>

    <script type="module">
        const params = new URLSearchParams(window.location.search);
        const slug = (params.get('slug') || '').trim().toLowerCase();
        const loadingEl = document.getElementById('loadingState');
        const schoolEl = document.getElementById('schoolState');
        const notFoundEl = document.getElementById('notFoundState');

        function showNotFound() {
            loadingEl.style.display = 'none';
            notFoundEl.style.display = 'block';
            document.title = 'School not found — SpringDrill';
        }

        if (!slug || !/^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(slug)) {
            showNotFound();
        } else {
            try {
                const res = await fetch('/api/school-by-slug?slug=' + encodeURIComponent(slug));
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.school) {
                    showNotFound();
                } else {
                    const s = data.school;
                    document.title = s.name + ' — SpringDrill';
                    document.getElementById('schoolName').textContent = s.name;
                    if (s.motto) document.getElementById('schoolMotto').textContent = s.motto;
                    if (s.address) document.getElementById('schoolAddress').textContent = s.address;
                    if (s.logo_url) {
                        const img = document.getElementById('schoolLogo');
                        img.src = s.logo_url;
                        img.style.display = 'inline-block';
                    }
                    const notice = document.getElementById('schoolNotice');
                    const loginBlock = document.getElementById('loginBlock');
                    if (s.status === 'paused') {
                        notice.className = 'alert alert-warning';
                        notice.textContent = 'This school\u2019s SpringDrill membership is paused. Please renew to continue.';
                        notice.style.display = 'block';
                        loginBlock.style.display = 'none';
                    } else if (s.status === 'pending') {
                        notice.className = 'alert alert-info';
                        notice.textContent = 'This school is opening soon — its application is still being reviewed.';
                        notice.style.display = 'block';
                        loginBlock.style.display = 'none';
                    } else if (s.status === 'declined') {
                        notice.className = 'alert alert-secondary';
                        notice.textContent = 'This school is not on SpringDrill.';
                        notice.style.display = 'block';
                        loginBlock.style.display = 'none';
                    }
                    loadingEl.style.display = 'none';
                    schoolEl.style.display = 'block';
                }
            } catch (err) {
                showNotFound();
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
